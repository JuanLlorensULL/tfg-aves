[project]
name = "tfg-aves"
version = "0.1.0"
description = "Predicción de desplazamientos diarios de Larus fuscus mediante cadenas de Markov, HMM y aprendizaje automático sobre datos GPS. TFG, UPM."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Juan Llorens" }]
license = { text = "MIT" }

dependencies = [
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyarrow>=16.0",          # parquet I/O for interim/processed
    # Geo
    "geopy>=2.4",             # haversine distances / great-circle math
    # Modelling
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "hmmlearn>=0.3",
    # Visualisation
    "matplotlib>=3.8",
    "folium>=0.17",
    "plotly>=5.22",
    # Notebooks
    "jupyterlab>=4.2",
    "jupytext>=1.16",
    "ipykernel>=6.29",
    "cartopy>=0.25.0",
    # Meteo
    "netcdf4>=1.6",
    "xarray>=2024.0",
    "quantile-forest>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfg_aves"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
